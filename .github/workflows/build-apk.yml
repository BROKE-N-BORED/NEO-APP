# Builds the NEO debug APK on every push to main, every pull request,
# and on demand. The APK is uploaded as an artifact (NEO-debug).
#
# NOTE: GitHub Actions on this account was blocked by a billing lock as of
# 2026-11-13 (jobs died in seconds). Clear the billing lock in GitHub
# billing settings before expecting this workflow to run. The local build
# (see README.md) does not depend on Actions.
name: Build debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEO-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
