# Project-wide Gradle settings for NEO.
# NOTE: proxy settings for sandboxed/CI builds do NOT live here — they belong
# in ~/.gradle/gradle.properties on the build machine, so this file stays clean
# for any machine that builds the project.
# Heap is 1g (not the usual 2g): this is a small app, and the sandbox it was
# first attempted on could not start a 2g daemon JVM under load.
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
